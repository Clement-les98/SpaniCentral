<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Admin Login</title>

  <link rel="stylesheet" href="/css/style.css">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {

      font-family: Arial, sans-serif;

      height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      background:
      linear-gradient(to right, #0a66c2, #004182);
    }

    .login-container {

      background: white;

      width: 400px;

      padding: 40px;

      border-radius: 15px;

      box-shadow:
      0 10px 25px rgba(0,0,0,0.2);
    }

    .login-container h1 {

      text-align: center;

      margin-bottom: 30px;

      color: #0a66c2;
    }

    .form-group {

      margin-bottom: 20px;
    }

    .form-group label {

      display: block;

      margin-bottom: 8px;

      font-weight: bold;

      color: #333;
    }

    .form-group input {

      width: 100%;

      padding: 12px;

      border: 1px solid #ccc;

      border-radius: 8px;

      font-size: 14px;
    }

    .login-btn {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 8px;

      background: #0a66c2;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.3s;
    }

    .login-btn:hover {
      background: #004182;
    }

    .footer-text {

      text-align: center;

      margin-top: 20px;

      color: #777;

      font-size: 14px;
    }

  </style>

</head>

<body>

  <div class="login-container">

    <h1>Admin Login</h1>

    <form id="loginForm">

      <!-- EMAIL -->

      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          id="email"
          placeholder="Enter admin email"
          required>

      </div>

      <!-- PASSWORD -->

      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required>

      </div>

      <!-- BUTTON -->

      <button
        type="submit"
        class="login-btn">

        Login

      </button>

    </form>

    <p class="footer-text">

      EntryLevelSA Admin Panel

    </p>

  </div>

  <script src="/js/login.js"></script>

</body>
</html>
